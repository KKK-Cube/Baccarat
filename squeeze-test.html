<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Card Squeeze Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a5c2a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: system-ui, sans-serif;
  user-select: none;
}

.hint {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  margin-bottom: 32px;
  text-align: center;
}

.card-stack {
  position: relative;
  width: 120px;
  height: 180px;
}

.card {
  position: absolute;
  width: 120px;
  height: 180px;
  border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 900;
  top: 0;
  left: 0;
}

/* Face card — white, sits underneath, revealed by squeezing */
.card-back {
  background: #fff;
  border: 2px solid #bbb;
  z-index: 1;
  clip-path: inset(100%);
  color: #111;
}

.card-back .corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.1;
  font-weight: 900;
}
.card-back .corner-tl { top: 7px; left: 9px; }
.card-back .corner-br { bottom: 7px; right: 9px; transform: rotate(180deg); }
.card-back .corner .c-rank { font-size: 17px; }
.card-back .corner .c-suit { font-size: 13px; }
.card-back .center-suit  { font-size: 58px; line-height: 1; }
.card-back.red-card { color: #d32f2f; }

/* Top card — white face card, draggable */
.card-front {
  background: #fff;
  border: 2px solid #bbb;
  z-index: 2;
  cursor: grab;
  transition: box-shadow 0.15s;
  color: #d32f2f;
}

.card-front:active { cursor: grabbing; }

.card-front .corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.1;
  font-weight: 900;
}
.card-front .corner-tl { top: 7px; left: 9px; }
.card-front .corner-br { bottom: 7px; right: 9px; transform: rotate(180deg); }
.card-front .corner .c-rank { font-size: 17px; }
.card-front .corner .c-suit { font-size: 13px; }
.card-front .center-suit { font-size: 58px; line-height: 1; }

.card-front.revealed {
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              box-shadow 0.35s;
}

.reset-btn {
  margin-top: 48px;
  padding: 12px 28px;
  border-radius: 999px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}

.reset-btn:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<p class="hint">Drag the top card any direction to squeeze</p>

<div class="card-stack" id="stack">
  <div class="card card-back" id="cardBack">
    <div class="corner corner-tl"><span class="c-rank">A</span><span class="c-suit">♠</span></div>
    <span class="center-suit">♠</span>
    <div class="corner corner-br"><span class="c-rank">A</span><span class="c-suit">♠</span></div>
  </div>
  <div class="card card-front" id="cardFront">
    <div class="corner corner-tl"><span class="c-rank">K</span><span class="c-suit">♥</span></div>
    <span class="center-suit">♥</span>
    <div class="corner corner-br"><span class="c-rank">K</span><span class="c-suit">♥</span></div>
  </div>
</div>

<button class="reset-btn" id="resetBtn">Reset</button>

<script>
'use strict';

const front = document.getElementById('cardFront');
const back  = document.getElementById('cardBack');
const resetBtn = document.getElementById('resetBtn');

const W = 120, H = 180;
const REVEAL_THRESHOLD = 140;
let dragging = false;
let startX = 0, startY = 0;
let currentX = 0, currentY = 0;
let revealed = false;

// Returns a clip-path polygon showing only what the front card has uncovered.
// The covered region is the intersection of the original card rect and the
// moved front card rect. The revealed region is everything else (an L-shape).
function getRevealClip(dx, dy) {
  const cx1 = Math.max(0, dx);
  const cy1 = Math.max(0, dy);
  const cx2 = Math.min(W, W + dx);
  const cy2 = Math.min(H, H + dy);

  if (cx1 >= cx2 || cy1 >= cy2) return null; // card fully dragged off — show everything

  let pts;
  if (dx >= 0 && dy <= 0) {
    // front card moved right and/or up → covered = top-right region
    if (dx === 0)      pts = [[0,cy2],[W,cy2],[W,H],[0,H]];           // bottom strip
    else if (dy === 0) pts = [[0,0],[cx1,0],[cx1,H],[0,H]];           // left strip
    else               pts = [[0,0],[cx1,0],[cx1,cy2],[W,cy2],[W,H],[0,H]]; // L-shape
  } else if (dx >= 0 && dy > 0) {
    // front card moved right and down → covered = bottom-right region
    if (dx === 0)      pts = [[0,0],[W,0],[W,cy1],[0,cy1]];           // top strip
    else               pts = [[0,0],[W,0],[W,cy1],[cx1,cy1],[cx1,H],[0,H]]; // L-shape
  } else if (dx < 0 && dy <= 0) {
    // front card moved left and/or up → covered = top-left region
    if (dy === 0)      pts = [[cx2,0],[W,0],[W,H],[cx2,H]];           // right strip
    else               pts = [[cx2,0],[W,0],[W,H],[0,H],[0,cy2],[cx2,cy2]]; // L-shape
  } else {
    // front card moved left and down → covered = bottom-left region
    pts = [[0,0],[W,0],[W,H],[cx2,H],[cx2,cy1],[0,cy1]]; // L-shape
  }

  return 'polygon(' + pts.map(([x,y]) => `${x}px ${y}px`).join(', ') + ')';
}

function getClient(e) {
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX, y: src.clientY };
}

function onStart(e) {
  if (revealed) return;
  dragging = true;
  const { x, y } = getClient(e);
  startX = x; startY = y;
  front.style.transition = 'none';
  back.style.transition = 'none';
  e.preventDefault();
}

function onMove(e) {
  if (!dragging) return;
  const { x, y } = getClient(e);
  currentX = x - startX;
  currentY = y - startY;

  front.style.transform = `translate(${currentX}px, ${currentY}px)`;

  const clip = getRevealClip(currentX, currentY);
  back.style.clipPath = clip === null ? 'none' : clip;

  e.preventDefault();
}

function onEnd() {
  if (!dragging) return;
  dragging = false;
  // Card stays exactly where it was dropped — no snap back, no fly off
}

front.addEventListener('touchstart', onStart, { passive: false });
front.addEventListener('touchmove', onMove, { passive: false });
front.addEventListener('touchend', onEnd);
front.addEventListener('mousedown', onStart);
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onEnd);

resetBtn.addEventListener('click', () => {
  currentX = 0; currentY = 0;
  front.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
  front.style.transform = 'translate(0, 0) rotate(0deg)';
  back.style.transition = 'clip-path 0.3s ease';
  back.style.clipPath = 'inset(100%)';
});
</script>
</body>
</html>
